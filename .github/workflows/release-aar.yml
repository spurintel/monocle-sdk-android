name: Release AAR

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build AAR
        run: ./gradlew :monocle:assembleRelease

      - name: Upload AAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: monocle-aar
          path: monocle/build/outputs/aar/*.aar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: monocle-aar
          path: ./monocle-aar

      - name: Rename AAR file
        run: mv ./monocle-aar/monocle-release.aar ./monocle-aar/monocle.aar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./monocle-aar/monocle.aar
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
